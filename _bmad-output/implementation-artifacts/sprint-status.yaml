# TICKET KEY CONVENTION:
# =====================
# Story keys are tickets: {project_key}-{n}-{kebab-title}, where {n} is a flat
# sequence across the whole backlog (PUB-1 .. PUB-60), allocated epic by epic in
# story order. PUB-1 is the first ticket of Epic 1. The trailing "# Story X.Y"
# comment maps each ticket back to its epic and story number in
# planning-artifacts/epics/, since the key no longer carries them.
#
# Story files are named {story-key}.md -- e.g. PUB-1-containerized-service-proven-against-the-real-stack.md
#
# Epic and retrospective keys are structural, NOT tickets: they stay as
# epic-{n} and epic-{n}-retrospective because bmad-sprint-status and
# bmad-retrospective classify entries by the literal "epic-" prefix and
# "-retrospective" suffix.
#
# New stories continue the sequence from the highest PUB-{n} in this file.
# Never renumber an existing ticket -- the number is its identity.
#
# A ticket too large for one review may be SPLIT into sub-tickets keyed
# {parent}-{i}-{kebab-title} -- PUB-4-1, PUB-4-2, PUB-4-3. The parent keeps its key and its
# title, stays in this file as an umbrella carrying no commit of its own, and reaches 'done'
# only when its last slice does. A split never allocates a new {n} and never renumbers
# anything: the parent already owns that number, and the slices are subdivisions of it.
# Splitting changes sequencing only -- scope stays whatever the epic says.

# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Epic Status Transitions:
#   - backlog → in-progress: Automatically when first story is created (via create-story)
#   - in-progress → done: Manually when all stories reach 'done' status
#
# Story Status:
#   - backlog: Story only exists in epic file
#   - ready-for-dev: Story file created in stories folder
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review (via Dev's code-review workflow)
#   - done: Story completed
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# Action Item Status:
#   - open: Committed during a retrospective, not yet addressed
#   - in-progress: Actively being worked on
#   - done: Completed
#
# WORKFLOW NOTES:
# ===============
# - Epic transitions to 'in-progress' automatically when first story is created
# - Stories can be worked in parallel if team capacity allows
# - Developer typically creates next story after previous one is 'done' to incorporate learnings
# - Dev moves story to 'review', then runs code-review (fresh context, different LLM recommended)
# - Retrospective appends its action items to action_items; sprint-status surfaces open ones

