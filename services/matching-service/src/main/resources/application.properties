spring.application.name=matching-service

# --- Datasource -------------------------------------------------------------
spring.datasource.url=${MATCHING_SERVICE_DB_URL}
spring.datasource.username=${MATCHING_SERVICE_DB_USER}
spring.datasource.password=${MATCHING_SERVICE_DB_PASSWORD}

# The service starts even when Postgres is unreachable and reports DOWN until it
# is (AD-1, AC2/AC4) -- it does not crash on boot. A negative value tells Hikari
# not to fail pool initialisation.
spring.datasource.hikari.initialization-fail-timeout=-1

# AC4: HikariCP's default connection-timeout is 30s, far too late for a Kubernetes readiness probe.
# connection-timeout: how long do we wait to get a connection
# TODO: to confirm these numbers in Epic 7's readiness probe config
spring.datasource.hikari.connection-timeout=2000
# validation-timeout: how long Hikari waits for a connection in a pool to check if is still alive
spring.datasource.hikari.validation-timeout=1000

# --- Flyway -----------------------------------------------------------------
spring.flyway.enabled=true

# --- Observability (AD-54) --------------------------------------------------
management.endpoints.web.exposure.include=health,prometheus
# As we don't have authentication nor authorization, we need to leave it open for everybody.
# TODO: we need to check though if we can only allow k8s to reach the port where this is exposed
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# We should never cache the health endpoint
management.endpoint.health.cache.time-to-live=0

# --- gRPC (AD-37, AD-5) -----------------------------------------------------
# A listener of its own, separate from the actuator HTTP port.
spring.grpc.server.port=9090

# --- Request id (AD-54, AD-5) -----------------------------------------------
# Making sure the request id gets logged on every log entry
logging.pattern.level=%5p [%X{requestId:-}]
