spring.application.name=rider-service

# --- Observability (AD-54) --------------------------------------------------
management.endpoints.web.exposure.include=health,prometheus
# As we don't have authentication nor authorization, we need to leave it open for everybody.
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# We should never cache the health endpoint
management.endpoint.health.cache.time-to-live=0

# --- gRPC client (AD-37) ----------------------------------------------------
# Compose supplies static://matching-service:9090. No address literal in source.
spring.grpc.client.channel.matching.target=${MATCHING_SERVICE_GRPC_TARGET}

# --- JSON -------------------------------------------------------------------
# FR-1 wants no "eta" key at all when there is no ETA, not "eta":null. QuoteResponse carries a
# nullable Long, so non_null would do that too -- the setting that actually differs is `always`,
# which was planted on 2026-09-12 and produced {"fare":7,"distance":3,"eta":null} and a red test.
# non_absent is kept because it also covers an Optional-shaped field, which model/Quote already is.
spring.jackson.default-property-inclusion=non_absent

# --- Request id (AD-54, AD-5) -----------------------------------------------
# Making sure the request id gets logged on every log entry
logging.pattern.level=%5p [%X{requestId:-}]
