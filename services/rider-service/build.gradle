plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.6'
}

group = 'com.puber'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// ---------------------------------------------------------------------------
// Static analysis (AC16, AC17, AD-52)
//
// There is no root build and no shared Gradle plugin. The project's single
// analyzer configuration source lives in `static-analyzers/` at the repository
// root and is copied into this service's build output by `make build`,
// immediately before this wrapper is invoked. Applying it from build output
// keeps the source single and the copies obviously disposable.
//
// The copy cannot be a Gradle `Copy` task: `apply from:` resolves at
// configuration time, while a `Copy` task runs at execution time, so the file
// would not exist yet when Gradle needs it.
// ---------------------------------------------------------------------------
def analyzerConfig = layout.buildDirectory.file('static-analyzers/spotless.gradle').get().asFile
if (!analyzerConfig.exists()) {
	throw new GradleException(
			"""
			Static-analysis configuration is missing:
			  ${analyzerConfig}

			Run `make build` from the repository root. It copies static-analyzers/ AND
			contracts/proto/ into each service's build output before invoking that
			service's Gradle wrapper (AD-52). Invoking ./gradlew directly inside a
			service bypasses both copies.
			""".stripIndent())
}
apply from: analyzerConfig

// ---------------------------------------------------------------------------
// The gRPC contract (AC8, AD-52)
//
// Same mechanism as the analyzer config above: `contracts/proto/` at the repository
// root is the single source, `make` copies it here, and codegen reads the copy. Each
// service generates its own stubs, so no service depends on another's code.
// ---------------------------------------------------------------------------
// The plugin already looks in src/main/proto on its own, and the srcDir line below ADDS to
// that list rather than replacing it. So a .proto left in there gets compiled too, this
// service quietly ends up owning a contract of its own, and AD-52's "one source" becomes a
// claim nothing checks.
def perServiceProto = file('src/main/proto')
if (perServiceProto.exists()) {
	throw new GradleException(
			"""
			A per-service contract source exists:
			  ${perServiceProto}

			AD-52: contracts/ at the repository root is the ONE source. `make` copies it into
			build/contracts/proto and codegen reads that copy. Move these .proto files to
			contracts/proto/ and delete this directory.
			""".stripIndent())
}

// The Provider form, NOT `.get().asFile`: resolving it here would read build output at
// configuration time, and the image build runs `./gradlew dependencies` before the contract
// has been copied in -- deliberately, so that editing a .proto does not re-resolve the whole
// runtime classpath.
sourceSets.main.proto.srcDir layout.buildDirectory.dir('contracts/proto')

// The analyzer message above used to promise this check and not perform it: the guard tested
// only the analyzer config, so a tree with build/static-analyzers but no build/contracts
// passed it and died later as `cannot find symbol: GetQuoteRequest` -- the failure the
// message describes, without the message ever printing. Checked when codegen actually runs,
// for the same reason the srcDir above stays lazy.
tasks.matching { it.name.startsWith('generateProto') }.configureEach {
	doFirst {
		def contractProto = layout.buildDirectory.dir('contracts/proto').get().asFile
		if (!contractProto.exists()) {
			throw new GradleException(
					"""
					The gRPC contract is missing:
					  ${contractProto}

					Run `make build` from the repository root. Its `contract-config` target
					copies contracts/proto/ into each service's build output before invoking
					that service's Gradle wrapper (AD-52). Invoking ./gradlew directly inside
					a service bypasses that copy.
					""".stripIndent())
		}
	}
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${dependencyManagement.managedVersions['com.google.protobuf:protobuf-java']}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${dependencyManagement.managedVersions['io.grpc:grpc-api']}"
		}
	}
	generateProtoTasks {
		all().each { it.plugins { grpc {} } }
	}
}

// ---------------------------------------------------------------------------
// Integration tests: a second group of tests with a Gradle task of their own.
//
// This declares `src/integrationTest/java` -- compiled separately from
// `src/test/java` and run by `./gradlew integrationTest` rather than
// `./gradlew test`. That is what makes `make test-unit` and `make test-integration`
// two commands. `make test` runs both.
//
// WHY NOT JUST PUT THEM IN src/test/java
//
// `make build` runs `./gradlew build` with `--no-deps`, meaning nothing else is
// running. `build` includes `check`, and `check` includes `test` -- so a test that
// opens a socket, including the gRPC channel this service calls out on, would fail
// every single build. A separate source set makes these a separate task that
// `build` never runs.
//
// ---------------------------------------------------------------------------
testing {
	suites {
		integrationTest(JvmTestSuite) {
			// A JvmTestSuite adds a JUnit Jupiter dependency of its OWN, and if left to its
			// default that version WINS the conflict against Boot's BOM: it silently
			// downgrades org.junit.jupiter:junit-jupiter from Boot's managed 6.0.3 to
			// Gradle's bundled 5.x, while junit-platform-engine stays at 6.0.3 -- a JUnit 5
			// API running on a JUnit 6 engine. Reading the version back out of the BOM keeps
			// Boot the single owner of it, so a Boot upgrade still moves it.
			useJUnitJupiter(dependencyManagement.managedVersions['org.junit.jupiter:junit-jupiter'])

			dependencies {
				// The service's own main classes. `project()` is the suite equivalent of
				// adding sourceSets.main.output to the classpath by hand.
				implementation project()
			}
		}
	}
}

// Everything the unit tests get, the integration tests get too -- declared once rather
// than listed twice. The suite creates these configurations under its own name, so
// extending them works exactly as it did with a hand-rolled source set.
configurations {
	integrationTestImplementation.extendsFrom implementation, testImplementation
	integrationTestRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-grpc-client'
	// The client starter carries grpc-stub at compile scope and grpc-protobuf only at
	// runtime, while the generated *Grpc.java references both at compile time. The
	// asymmetry with matching-service's server starter -- which ships no grpc-stub at all
	// -- reads as a copy-paste error and is not one.
	implementation 'io.grpc:grpc-protobuf'
	implementation 'com.google.protobuf:protobuf-java'
	// What creates /actuator/prometheus. Without it AC7's endpoint 404s in the running
	// service.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Boot 4.x splits the test starters; there is deliberately no monolithic
	// spring-boot-starter-test. Add the matching `-test` starter when a new
	// capability starter is added.
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Brings grpc-inprocess, so a test can stand the peer up in-process rather than on a
	// port. It also drags in the monolithic spring-boot-starter-test transitively -- that
	// is Boot's choice inside its own capability starter, not ours, and is not a reason to
	// add an exclude block.
	testImplementation 'org.springframework.boot:spring-boot-starter-grpc-client-test'
	// Stops /actuator/prometheus 404ing under @SpringBootTest, where Boot disables the
	// metrics exporters.
	testImplementation 'org.springframework.boot:spring-boot-starter-micrometer-metrics-test'
	// Boot 4 relocated TestRestTemplate here and no longer registers it off the back of
	// webEnvironment=RANDOM_PORT alone -- tests opt in with @AutoConfigureTestRestTemplate.
	// Boot 4 also modularized the blocking REST clients, so TestRestTemplate's own
	// RestTemplateBuilder is a second, separate module rather than part of the web starter.
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// `archunit-junit6`, not `junit5`: Boot 4.1.0 manages JUnit Jupiter 6, and the
	// junit6 module first appears in ArchUnit 1.5.0. Not BOM-managed, so pinned here.
	testImplementation 'com.tngtech.archunit:archunit-junit6:1.5.0'
}

// AD-56: tests run sequentially against one shared stack.
tasks.withType(Test).configureEach {
	useJUnitPlatform()
	maxParallelForks = 1
	// Gradle caches a passing test task, so a second `make test`
	// prints BUILD SUCCESSFUL having run nothing.
	outputs.upToDateWhen { false }
	systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
	testLogging {
		// Assignment syntax, not the space form: Gradle 9 deprecates
		// `propName value` in the Groovy DSL and removes it in Gradle 10.
		events = ['passed', 'skipped', 'failed']
		exceptionFormat = 'full'
	}
}

// Coming from org.springframework.boot, setting a explicitly named artifact to avoid collisions.
tasks.named('bootJar') {
	archiveFileName = 'rider-service.jar'
}

// Integration tests are compiled by `check` even though they are not RUN by it: the
// transport they need is unavailable during an image build, but a compile error in
// src/integrationTest has no such excuse. Without this it survives `make build` and
// `pre-commit` and first appears deep inside `pre-push`, after the stack is already up.
tasks.named('check') {
	dependsOn 'compileIntegrationTestJava'
}

tasks.named('integrationTest') {
	description = 'Runs integration tests against the real Compose stack (AD-56).'
	shouldRunAfter tasks.named('test')
}
